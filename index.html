<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>My schedule</title>
<meta name="theme-color" content="#34449a">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="My schedule">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" href="icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Shippori+Mincho+B1:wght@700;800&family=Zen+Kaku+Gothic+New:wght@400;500;700&family=DM+Mono:wght@400;500&display=swap">
<style>
/* 柔道着の藍と白。スマホは下にタブ、iPad/Mac は左にメニュー＋2列 */
:root{
  --bg:#f2f4f8; --card:#ffffff; --ink:#1a2240; --muted:#646e88; --line:#dce1eb; --soft:#e9edf5;
  --accent:#34449a; --accent-soft:#e3e7f7;
  --paid:#1d845a; --paid-soft:#dff3ea; --due:#c4433a; --due-soft:#fbe5e3; --plan:#8a6a12; --plan-soft:#f6eed6;
  --f-display:"Shippori Mincho B1","Hiragino Mincho ProN",serif;
  --f-body:"Zen Kaku Gothic New","Hiragino Sans","Hiragino Kaku Gothic ProN",system-ui,sans-serif;
  --f-num:"DM Mono",ui-monospace,Menlo,monospace;
  --r:14px;
  --t-practice:#0f7f8c; --t-match:#c0601a; --t-ref:#4a5a78; --t-sem:#7a4bb0; --t-exam:#8a5a2b; --t-travel:#2f6f3e; --t-other:#5d6578;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0e1220; --card:#161b2b; --ink:#e7eaf3; --muted:#9aa3ba; --line:#283049; --soft:#1e2436;
  --accent:#9aa8ff; --accent-soft:#252c4d;
  --paid:#52c58f; --paid-soft:#173527; --due:#ff8378; --due-soft:#3a1d1c; --plan:#e2c065; --plan-soft:#352c14;
  --t-practice:#5cc8d4; --t-match:#f0a060; --t-ref:#a5b4d6; --t-sem:#c4a0f0; --t-exam:#d9a874; --t-travel:#7fcf92; --t-other:#a7afc2;
  color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0e1220; --card:#161b2b; --ink:#e7eaf3; --muted:#9aa3ba; --line:#283049; --soft:#1e2436;
  --accent:#9aa8ff; --accent-soft:#252c4d;
  --paid:#52c58f; --paid-soft:#173527; --due:#ff8378; --due-soft:#3a1d1c; --plan:#e2c065; --plan-soft:#352c14;
  --t-practice:#5cc8d4; --t-match:#f0a060; --t-ref:#a5b4d6; --t-sem:#c4a0f0; --t-exam:#d9a874; --t-travel:#7fcf92; --t-other:#a7afc2;
  color-scheme:dark}
*{box-sizing:border-box}
:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
body{margin:0}
img{max-width:100%}
[hidden]{display:none!important}
.login{max-width:380px;margin:12vh auto 0;display:grid;gap:14px}
.login .brand{font-size:30px;text-align:center}
.login .card{display:grid;gap:12px}
.err{color:var(--due);font-size:14px;font-weight:700}
.loading{color:var(--muted);text-align:center;padding:60px 0}
.sync{font-size:12px;color:var(--muted)}
.sync.bad{color:var(--due);font-weight:700}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.6;-webkit-text-size-adjust:100%}
button{font:inherit;color:inherit;cursor:pointer}
input,select,textarea{font:inherit;font-size:16px;color:var(--ink);background:var(--card);border:1px solid var(--line);border-radius:10px;padding:10px 12px;width:100%}
textarea{resize:vertical;min-height:84px}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.num{font-family:var(--f-num);font-variant-numeric:tabular-nums}

.app{display:flex;min-height:100vh}
nav.side{display:none}
main{flex:1;min-width:0;padding-inline:16px;padding-block:16px 110px;max-width:1040px;margin:0 auto;width:100%;overflow-x:clip}
header.top{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:14px}
.brand{font-family:var(--f-display);font-weight:800;font-size:24px;letter-spacing:.04em}
.brand small{display:block;font-family:var(--f-body);font-weight:500;font-size:11px;letter-spacing:.14em;color:var(--muted)}
.btn{border:0;border-radius:999px;padding:10px 18px;font-weight:700;background:var(--ink);color:var(--bg);white-space:nowrap}
.btn.ghost{background:var(--soft);color:var(--ink)}
.btn.sm{padding:6px 12px;font-size:13px}
.btn.paid{background:var(--paid);color:var(--card)}
.btn.danger{background:var(--due-soft);color:var(--due)}
.btn.block{width:100%;padding:14px}

.tabbar{position:fixed;left:0;right:0;bottom:0;background:color-mix(in srgb,var(--card) 92%,transparent);backdrop-filter:blur(12px);border-top:1px solid var(--line);display:grid;grid-template-columns:repeat(4,1fr);padding:6px 6px calc(6px + env(safe-area-inset-bottom,0px));z-index:20}
.tabbar button,.side button.nav{border:0;background:none;display:flex;flex-direction:column;align-items:center;gap:2px;padding:6px 0;font-size:11px;color:var(--muted);font-weight:500}
.tabbar svg,.side svg{width:22px;height:22px;stroke:currentColor;fill:none;stroke-width:1.8}
.tabbar button[aria-current="true"],.side button[aria-current="true"]{color:var(--accent)}
.fab{position:fixed;right:16px;bottom:calc(76px + env(safe-area-inset-bottom,0px));z-index:21;border:0;border-radius:999px;background:var(--accent);color:var(--card);font-weight:700;padding:14px 20px;box-shadow:0 8px 24px color-mix(in srgb,var(--accent) 35%,transparent)}

.notice{background:var(--plan-soft);color:var(--plan);border-radius:10px;padding:8px 12px;font-size:13px;display:flex;gap:10px;align-items:center;justify-content:space-between;flex-wrap:wrap;margin-bottom:14px}
.notice button{border:0;background:none;text-decoration:underline;color:inherit;font-size:13px;padding:0}

.grid2{display:grid;gap:14px}
section.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:14px 16px;min-width:0}
h2{font-size:13px;letter-spacing:.12em;color:var(--muted);font-weight:700;margin:0 0 10px;display:flex;justify-content:space-between;align-items:center;gap:8px}
h2 b{font-family:var(--f-num);color:var(--ink);letter-spacing:0;font-size:14px}
h3{font-family:var(--f-display);font-size:22px;margin:0;text-wrap:balance}
.empty{color:var(--muted);font-size:14px;padding:6px 0}

.kpis{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:14px}
.kpi{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:10px 12px;min-width:0}
.kpi span{display:block;font-size:11px;color:var(--muted);letter-spacing:.08em}
.kpi b{font-family:var(--f-num);font-size:20px;font-weight:500}
.kpi.due b{color:var(--due)}

.row{display:flex;gap:12px;align-items:center;padding:10px 0;border-top:1px solid var(--line);width:100%;text-align:left;background:none;border-left:0;border-right:0;border-bottom:0}
.row:first-of-type{border-top:0}
.when{flex:none;width:54px;text-align:center;line-height:1.25}
.when b{display:block;font-family:var(--f-num);font-size:15px;font-weight:500}
.when span{font-size:11px;color:var(--muted)}
.what{flex:1;min-width:0}
.what .nm{font-weight:700;display:flex;align-items:center;gap:6px}
.what .sub{font-size:13px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.dot{width:9px;height:9px;border-radius:50%;flex:none}
.pill{flex:none;font-size:12px;font-weight:700;border-radius:999px;padding:3px 10px;white-space:nowrap}
.pill.paid{background:var(--paid-soft);color:var(--paid)}
.pill.due{background:var(--due-soft);color:var(--due)}
.pill.ticket{background:var(--accent-soft);color:var(--accent)}
.pill.plan{background:var(--plan-soft);color:var(--plan)}
.pill.warn{background:var(--plan-soft);color:var(--plan)}

/* calendar */
.calhead{display:flex;align-items:center;justify-content:space-between;margin-bottom:8px}
.calhead button{border:0;background:var(--soft);border-radius:999px;width:36px;height:36px;font-size:18px}
.cal{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:3px}
.cal .dow{font-size:11px;text-align:center;color:var(--muted);padding-bottom:2px}
.cal .d{min-height:58px;min-width:0;overflow:hidden;border:1px solid transparent;border-radius:9px;background:var(--soft);display:flex;flex-direction:column;align-items:stretch;justify-content:flex-start;padding:3px 2px;gap:2px;font-family:var(--f-num);font-size:12px;text-align:left}
.cal .d .n{padding-left:3px;line-height:1.3}
.cal .d.out{opacity:.35}
.cal .d.today .n{color:var(--accent);font-weight:500}
.cal .d.today{border-color:var(--accent)}
.cal .d.sel{background:var(--accent-soft);border-color:var(--accent)}
.ev{display:block;font-family:var(--f-body);font-size:10px;line-height:1.4;border-radius:4px;padding:0 3px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-weight:700}
.ev .t{display:none;font-family:var(--f-num);font-weight:400;margin-right:3px}
.ev.paid{background:var(--paid-soft);color:var(--paid)} .ev.due{background:var(--due-soft);color:var(--due)} .ev.ticket{background:var(--accent-soft);color:var(--accent)} .ev.plan{background:var(--card);color:var(--plan);box-shadow:inset 0 0 0 1px var(--plan)} .ev.off{background:none;color:var(--muted);text-decoration:line-through;font-weight:400}
.m{display:inline-block;width:10px;height:10px;border-radius:3px}
.m.paid{background:var(--paid)} .m.due{background:var(--due)} .m.ticket{background:var(--accent)} .m.plan{box-shadow:inset 0 0 0 1.5px var(--plan)} .m.off{background:var(--line)}
@media (min-width:700px){.cal .d{min-height:84px;padding:4px}.ev{font-size:11px;padding:1px 4px}.ev .t{display:inline}}
.legend{display:flex;gap:12px;flex-wrap:wrap;font-size:12px;color:var(--muted);margin-top:10px}
.legend span{display:flex;align-items:center;gap:5px}

/* students */
.stu{display:flex;gap:12px;align-items:center}
.avatar{width:40px;height:40px;border-radius:50%;display:grid;place-items:center;font-weight:700;color:#fff;flex:none}
.meta{display:flex;gap:6px;flex-wrap:wrap;margin-top:4px}
.back{border:0;background:none;color:var(--accent);padding:0;margin-bottom:10px;font-weight:700}
.pkg{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:10px 0;border-top:1px solid var(--line)}
.pkg:first-of-type{border-top:0}
.bar{height:8px;border-radius:99px;background:var(--soft);overflow:hidden;margin-top:6px}
.bar i{display:block;height:100%;background:var(--accent);border-radius:99px}
.lognote{font-size:14px;white-space:pre-wrap;margin-top:4px}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{border:1px solid var(--line);background:var(--card);border-radius:999px;padding:6px 12px;font-size:13px}
.chip[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:var(--card)}
.tag{font-size:12px;background:var(--soft);border-radius:6px;padding:1px 8px}

/* money */
.bars{display:grid;grid-template-columns:repeat(6,1fr);gap:8px;align-items:end;height:150px;padding-top:18px;border-bottom:1px solid var(--line)}
.bars div{display:flex;flex-direction:column;align-items:center;justify-content:flex-end;height:100%;gap:4px;min-width:0}
.bars i{display:block;width:70%;max-width:44px;background:var(--accent-soft);border-radius:6px 6px 0 0;min-height:2px}
.bars div.cur i{background:var(--accent)}
.bars small{font-family:var(--f-num);font-size:11px;color:var(--muted)}
.bars em{font-style:normal;font-family:var(--f-num);font-size:11px}
.blabels{display:grid;grid-template-columns:repeat(6,1fr);gap:8px;text-align:center;font-size:12px;color:var(--muted);padding-top:4px}
table{width:100%;border-collapse:collapse;font-size:14px}
td,th{padding:8px 4px;border-top:1px solid var(--line);text-align:left}
th{font-size:12px;color:var(--muted);font-weight:500;border-top:0}
td.r,th.r{text-align:right;font-family:var(--f-num)}
.tablewrap{overflow-x:auto}

/* sheet */
.overlay{position:fixed;inset:0;background:rgba(10,14,30,.45);z-index:40;display:flex;align-items:flex-end;justify-content:center}
.sheet{background:var(--bg);width:100%;max-width:620px;max-height:92vh;overflow-y:auto;border-radius:18px 18px 0 0;padding:0 16px calc(20px + env(safe-area-inset-bottom,0px))}
.sheet .sh{position:sticky;top:0;background:var(--bg);display:flex;justify-content:space-between;align-items:center;padding:14px 0 10px;z-index:2;border-bottom:1px solid var(--line);margin-bottom:12px}
.sheet .sh b{font-size:17px}
.sheet .x{border:0;background:var(--soft);border-radius:999px;width:34px;height:34px;font-size:16px}
.fld{display:grid;gap:6px;margin-bottom:14px}
.fld>label,.fld>.lb{font-size:13px;font-weight:700;color:var(--muted)}
.two{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,130px),1fr));gap:10px}
.seg{display:grid;grid-template-columns:repeat(3,1fr);background:var(--soft);border-radius:12px;padding:3px;gap:3px}
.seg button{border:0;background:none;border-radius:9px;padding:9px 4px;font-weight:700;font-size:14px;color:var(--muted)}
.seg button[aria-pressed="true"]{background:var(--card);color:var(--ink);box-shadow:0 1px 3px rgba(0,0,0,.12)}
.prev{background:var(--plan-soft);color:var(--ink);border-radius:12px;padding:10px 12px;font-size:14px;margin-bottom:14px}
.prev b{color:var(--plan);font-size:12px;display:block;letter-spacing:.06em}
.paybox{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:12px;display:grid;gap:12px}
.hint{font-size:13px;color:var(--muted)}
.check{display:flex;gap:8px;align-items:center;font-weight:700;font-size:14px}
.check input{width:20px;height:20px}

.toast{position:fixed;left:50%;top:calc(16px + env(safe-area-inset-top,0px));transform:translate(-50%,-20px);opacity:0;background:var(--ink);color:var(--bg);padding:12px 18px;border-radius:14px;font-weight:700;z-index:60;transition:.25s;max-width:calc(100% - 32px);text-align:center}
.toast.on{transform:translate(-50%,0);opacity:1}
.toast small{display:block;font-weight:400;opacity:.8;font-size:13px}

.pill.off{background:var(--soft);color:var(--muted)}
.pills{display:flex;flex-direction:column;gap:3px;align-items:flex-end;flex:none}
.todo{display:flex;gap:10px;align-items:flex-start;padding:8px 0;border-top:1px solid var(--line)}
.todo:first-child{border-top:0}
.todo input{width:20px;height:20px;flex:none;margin-top:2px}
.todo .tx{flex:1;min-width:0;font-size:15px;white-space:pre-wrap}
.todo.done .tx{color:var(--muted);text-decoration:line-through}
.todo .del{border:0;background:none;color:var(--muted);font-size:13px;padding:2px 4px}
.addrow{display:flex;gap:8px;margin-top:8px}
.addrow input{flex:1;min-width:0}
.radio{display:grid;gap:6px}
.radio label{display:flex;gap:10px;align-items:flex-start;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:10px 12px;font-size:14px;cursor:pointer}
.radio label:has(input:checked){border-color:var(--accent);background:var(--accent-soft)}
.radio input{width:18px;height:18px;margin-top:2px;flex:none}
.radio small{display:block;color:var(--muted);font-size:12px}
.planbox{font-size:14px;white-space:pre-wrap}
.gear{border:0;background:var(--soft);border-radius:999px;padding:8px 12px;font-size:13px;font-weight:700}
.type{font-size:12px;font-weight:700;color:var(--accent);margin-left:4px}
.vbar{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-bottom:10px}
.vbar .grow{flex:1;min-width:120px}
.vbar h3{font-size:19px}
.navb{border:0;background:var(--soft);border-radius:999px;min-width:36px;height:36px;font-size:16px;padding:0 12px;font-weight:700}
.vseg{display:flex;background:var(--soft);border-radius:10px;padding:3px;gap:2px}
.vseg button{border:0;background:none;border-radius:8px;padding:6px 10px;font-size:13px;font-weight:700;color:var(--muted)}
.vseg button[aria-pressed="true"]{background:var(--card);color:var(--ink);box-shadow:0 1px 3px rgba(0,0,0,.12)}
.tg{border:1px solid var(--line);border-radius:12px;overflow:hidden;background:var(--card)}
.tg-head,.tg-all{display:grid;grid-template-columns:44px repeat(var(--n),minmax(0,1fr));border-bottom:1px solid var(--line)}
.tg-head button{border:0;background:none;padding:6px 2px;text-align:center;font-size:11px;color:var(--muted)}
.tg-head b{display:block;font-family:var(--f-num);font-size:18px;font-weight:500;color:var(--ink);width:32px;height:32px;line-height:32px;margin:0 auto;border-radius:999px}
.tg-head .today b{background:var(--accent);color:var(--card)}
.tg-all>div{min-height:26px;padding:2px;border-left:1px solid var(--line);display:flex;flex-direction:column;gap:2px;min-width:0}
.tg-all .lab{border-left:0;font-size:10px;color:var(--muted);text-align:right;padding:6px 6px 0 0}
.tg-body{height:min(66vh,640px);overflow-y:auto;position:relative;overscroll-behavior:contain}
.tg-grid{display:grid;grid-template-columns:44px repeat(var(--n),minmax(0,1fr));position:relative;height:calc(var(--h) * 24)}
.tg-times{position:relative}
.tg-times span{position:absolute;right:6px;transform:translateY(-50%);font-size:10px;color:var(--muted);font-family:var(--f-num)}
.tg-col{position:relative;border-left:1px solid var(--line);background-image:repeating-linear-gradient(to bottom,var(--line) 0 1px,transparent 1px var(--h));cursor:pointer;min-width:0}
.tg-col.today{background-color:color-mix(in srgb,var(--accent-soft) 45%,transparent)}
.blk{position:absolute;border:0;border-radius:6px;padding:2px 5px;text-align:left;font-size:11px;line-height:1.3;overflow:hidden;font-weight:700;z-index:2}
.blk small{display:block;font-weight:400;font-family:var(--f-num);font-size:10px;opacity:.85;white-space:nowrap}
.blk.paid{background:var(--paid-soft);color:var(--paid)} .blk.due{background:var(--due-soft);color:var(--due)} .blk.ticket{background:var(--accent-soft);color:var(--accent)}
.blk.plan{background:var(--card);color:var(--plan);box-shadow:inset 0 0 0 1.5px var(--plan)} .blk.off{background:var(--soft);color:var(--muted);text-decoration:line-through;font-weight:400}
.blk.evt,.ev.evt{background:color-mix(in srgb,var(--c) 17%,var(--card));color:var(--c);box-shadow:inset 3px 0 0 var(--c)}
.blk.allday{position:static;width:100%;padding:1px 5px}
.now{position:absolute;left:0;right:0;height:2px;background:var(--due);z-index:3;pointer-events:none}
.now::before{content:"";position:absolute;left:-5px;top:-4px;width:10px;height:10px;border-radius:50%;background:var(--due)}
.pill.evt{background:color-mix(in srgb,var(--c) 16%,var(--card));color:var(--c)}
.m.evt{background:var(--c)}
.tsel{display:flex;align-items:center;gap:4px}
.tsel select{width:auto;min-width:68px;padding:10px 8px}
.tabs2{display:grid;grid-template-columns:1fr 1fr;background:var(--soft);border-radius:12px;padding:3px;gap:3px;margin-bottom:14px}
.tabs2 button{border:0;background:none;border-radius:9px;padding:10px 4px;font-weight:700;color:var(--muted)}
.tabs2 button[aria-pressed="true"]{background:var(--card);color:var(--ink);box-shadow:0 1px 3px rgba(0,0,0,.12)}
.ttl{font-size:20px;font-weight:700;border:0;border-bottom:2px solid var(--line);border-radius:0;padding:8px 2px;background:transparent}
.ttl:focus{border-bottom-color:var(--accent);outline:none}
.typechip{--c:var(--t-other)}
.pairchip{border-style:dashed;border-width:1.5px;font-weight:700}
.sheet:has(.foot){padding-bottom:0}
.foot{position:sticky;bottom:0;background:var(--bg);border-top:1px solid var(--line);padding:10px 0 calc(12px + env(safe-area-inset-bottom,0px));margin-top:10px;display:grid;gap:8px;z-index:3}
.whenbox{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:12px;display:grid;gap:10px;margin-bottom:14px}
.whenbox .lb{font-size:13px;font-weight:700;color:var(--muted)}
.trow{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.trow select{width:auto;min-width:104px;font-family:var(--f-num);font-size:18px;padding:10px 12px}
.trow .arrow{color:var(--muted)}
.trow .dlabel{font-size:13px;color:var(--muted)}

<script>
/* ---------- ことば（日本語／English） ---------- */
let LANGV='ja';
const L=(ja,en)=>LANGV==='en'?en:ja;
const DOW=['日','月','火','水','木','金','土'], DOW_EN=['Sun','Mon','Tue','Wed','Thu','Fri','Sat'], DOW_LONG=['Sunday','Monday','Tuesday','Wednesday','Thursday','Friday','Saturday'];
const METHOD_EN={'現金':'Cash','その他':'Other'};
const REASON_EN={'生徒の都合':'Student conflict','体調不良':'Illness','こちらの都合':'Coach conflict','天候':'Weather','その他':'Other'};
const WAZA_EN={'大外刈':'Osoto-gari','大内刈':'Ouchi-gari','小内刈':'Kouchi-gari','内股':'Uchi-mata','払腰':'Harai-goshi','背負投':'Seoi-nage','体落':'Tai-otoshi','袖釣込腰':'Sode-tsurikomi-goshi','小外刈':'Kosoto-gari','出足払':'Deashi-harai','巴投':'Tomoe-nage',
  '袈裟固':'Kesa-gatame','横四方固':'Yoko-shiho-gatame','上四方固':'Kami-shiho-gatame','縦四方固':'Tate-shiho-gatame','腕挫十字固':'Juji-gatame','送襟絞':'Okuri-eri-jime','寝技の返し':'Ne-waza turnovers',
  '受身':'Ukemi','打ち込み':'Uchikomi','乱取り':'Randori','組み手':'Grip fighting','体力づくり':'Conditioning','試合の作戦':'Match strategy'};
const WAZA_GROUP_EN={'立ち技':'Standing (nage-waza)','寝技':'Groundwork (ne-waza)','その他':'Other'};
const tMethod=m=>L(m,METHOD_EN[m]||m), tReason=r=>L(r,REASON_EN[r]||r), tWaza=w=>L(w,WAZA_EN[w]||w);
const EVT=[['practice','練習','Practice','--t-practice'],['match','試合・大会','Tournament','--t-match'],['referee','審判','Refereeing','--t-ref'],['seminar','講習会','Clinic','--t-sem'],['exam','昇段審査','Promotion exam','--t-exam'],['travel','遠征','Travel','--t-travel'],['other','その他','Other','--t-other']];
const evtInfo=t=>EVT.find(x=>x[0]===t)||EVT[6];
const evtName=t=>{const e=evtInfo(t);return L(e[1],e[2])};
const evtColor=t=>`var(${evtInfo(t)[3]})`;

/* ---------- データ ---------- */
const COLORS=['#34449a','#b5542b','#1d845a','#7a4bb0','#0f7f8c','#a3367a','#5f6b1e'];
const METHODS=['現金','Zelle','Venmo','その他'];
const REASONS=['生徒の都合','体調不良','こちらの都合','天候','その他'];
const WAZA={'立ち技':['大外刈','大内刈','小内刈','内股','払腰','背負投','体落','袖釣込腰','小外刈','出足払','巴投'],'寝技':['袈裟固','横四方固','上四方固','縦四方固','腕挫十字固','送襟絞','寝技の返し'],'その他':['受身','打ち込み','乱取り','組み手','体力づくり','試合の作戦']};

const pad=n=>String(n).padStart(2,'0');
const ymd=d=>`${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`;
const today=()=>ymd(new Date());
const parse=s=>{const [y,m,d]=s.split('-').map(Number);return new Date(y,m-1,d)};
const addDays=(s,n)=>{const d=parse(s);d.setDate(d.getDate()+n);return ymd(d)};
const md=s=>{const d=parse(s);return `${d.getMonth()+1}/${d.getDate()}`};
const dow=s=>L(DOW,DOW_EN)[parse(s).getDay()];
const dl=s=>L(`${md(s)}(${dow(s)})`,`${dow(s)} ${md(s)}`);
const ymTitle=(y,m)=>L(`${y}年${m}月`,new Date(y,m-1,1).toLocaleDateString('en-US',{month:'long',year:'numeric'}));
const mShort=m=>L(`${m}月`,new Date(2000,m-1,1).toLocaleDateString('en-US',{month:'short'}));
const money=n=>'$'+Number(n||0).toLocaleString('en-US');
const uid=()=>Math.random().toString(36).slice(2,10);
const toMin=t=>{const [h,m]=String(t).split(':').map(Number);return h*60+(m||0)};
const fromMin=n=>{n=Math.max(0,Math.min(n,23*60+55));return `${pad(Math.floor(n/60))}:${pad(n%60)}`};
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const N=(n,ja,en1,enN)=>L(`${n}${ja}`,`${n} ${n===1?en1:(enN||en1+'s')}`);
const shortName=n=>n.replace(/（.*?）|\s*\(.*?\)/g,'');

/* 料金：マンツーマンは30分あたり、ペアは1時間あたり（2人の合計を半分ずつ） */
function priceFor(sid,dur,n){
  if(n>=2)return Math.round(S.settings.pair60*dur/60/n);
  const s=stu(sid);return Math.round((s.custom30??S.settings.solo30)*dur/30);
}

const stu=id=>S.students.find(s=>s.id===id)||{id,name:L('（削除された生徒）','(deleted student)'),color:'#888',custom30:null,dur:60,todos:[]};
const byId=id=>S.lessons.find(l=>l.id===id);
/* 名前順・ペア */
const sortKey=x=>(x.kana||x.name||'');
const byName=(a,b)=>sortKey(a).localeCompare(sortKey(b),LANGV==='en'?'en':'ja',{numeric:true,sensitivity:'base'});
const studentsSorted=()=>[...S.students].sort(byName);
const hasStu=id=>S.students.some(s=>s.id===id);
const pairMembers=p=>[stu(p.a),stu(p.b)].sort(byName);
const pairName=p=>pairMembers(p).map(s=>s.name).join(L('・',' & '));
const pairsSorted=()=>S.pairs.filter(p=>hasStu(p.a)&&hasStu(p.b)).sort((x,y)=>pairName(x).localeCompare(pairName(y),LANGV==='en'?'en':'ja'));
const pairsOf=sid=>pairsSorted().filter(p=>p.a===sid||p.b===sid);
const samePair=(p,ids)=>ids.length===2&&ids.includes(p.a)&&ids.includes(p.b);
function pairChips(act,sel){
  const ps=pairsSorted();if(!ps.length)return '';
  return `<div class="hint" style="margin-top:2px">${L('ペアから選ぶ','Pick a pair')}</div><div class="chips" style="margin-bottom:4px">${ps.map(p=>`<button class="chip pairchip" data-act="${act}" data-id="${p.id}" aria-pressed="${samePair(p,sel)}">${esc(pairName(p))}</button>`).join('')}</div><div class="hint">${L('ひとりずつ選ぶ','Or pick students')}</div>`;
}
const done=()=>S.lessons.filter(l=>l.status==='done');
const used=pid=>S.lessons.filter(l=>l.status==='done'&&l.pay.mode==='ticket'&&l.pay.pid===pid).length;
const left=p=>p.count-used(p.id);
const activePkg=sid=>S.packages.filter(p=>p.sid===sid&&left(p)>0).sort((a,b)=>a.date.localeCompare(b.date));
const ticketNo=l=>{const own=sortL(S.lessons.filter(x=>x.status==='done'&&x.pay.mode==='ticket'&&x.pay.pid===l.pay.pid));return own.indexOf(l)+1};
const group=l=>l.gid?S.lessons.filter(x=>x.gid===l.gid):[l];
const names=ls=>ls.map(l=>stu(l.sid).name).join(L('・',' & '));
const dedupe=ls=>{const seen=new Set();return ls.filter(l=>{if(!l.gid)return true;if(seen.has(l.gid))return false;seen.add(l.gid);return true})};
const sortL=a=>a.sort((x,y)=>(x.date+x.time).localeCompare(y.date+y.time));
const pendingOf=sid=>sortL(S.lessons.filter(l=>l.sid===sid&&l.status==='cancelled'&&l.cancel?.carry==='pending'));
const isUnpaid=l=>l.status!=='planned'&&l.pay.mode==='per'&&!l.pay.paid&&+l.pay.amount>0&&l.cancel?.carry!=='pending';
const unpaidLessons=()=>sortL(S.lessons.filter(isUnpaid));
const unpaidPkgs=()=>S.packages.filter(p=>!p.paid);
const lastDone=sid=>sortL(S.lessons.filter(x=>x.sid===sid&&x.status==='done')).pop();

/* ---------- 保存（Supabase：柔道ノートと同じ場所。表は ms_items、コーチ本人だけ読み書きできる） ---------- */
const SUPABASE_URL='https://ktwunswfyxozcultprnq.supabase.co';
const SUPABASE_KEY='sb_publishable_P_UMeGV4gB54MjRBfjUIrA_E7drptd5';   // 公開用のキー（アプリに入れてよい値）
const VAPID_PUBLIC='BChblwq2SoS3NVeX2FjxGFMSOeHKVrf0K7fiwRVWOb0NFEEOZW772YZGAr2dJ_ZGAU4eRwGFpdcNNkF9cP6XHnE';
const ID_DOMAIN='players.judo-note.app';   // 柔道ノートと同じ ID でログインする
const idToEmail=id=>`${id.trim().toLowerCase()}@${ID_DOMAIN}`;
/* 通信は25秒で打ち切る（電波が弱いと「保存中…」のまま固まって見えるため） */
function fetchT(url,opts={}){const c=new AbortController(),tm=setTimeout(()=>c.abort(),25000);
  if(opts.signal){if(opts.signal.aborted)c.abort();else opts.signal.addEventListener('abort',()=>c.abort(),{once:true})}
  return fetch(url,{...opts,signal:c.signal}).finally(()=>clearTimeout(tm))}
const sb=window.supabase.createClient(SUPABASE_URL,SUPABASE_KEY,{auth:{persistSession:true,autoRefreshToken:true,storageKey:'my-schedule-auth'},global:{fetch:fetchT}});

const deviceTz=()=>{try{return Intl.DateTimeFormat().resolvedOptions().timeZone||'America/Los_Angeles'}catch(e){return 'America/Los_Angeles'}};
const defaultSettings=()=>({solo30:50,pair60:100,lang:LANGV,remind:'21:00',tz:deviceTz()});
const emptyState=()=>({settings:defaultSettings(),students:[],packages:[],lessons:[],events:[],pairs:[]});
let S=emptyState(), SNAP=new Map(), SESSION=null, LOADED=false, DIRTY=false;
const KINDS=[['students','student'],['lessons','lesson'],['events','event'],['packages','package'],['pairs','pair']];
function itemsMap(st){
  const m=new Map([['settings|main',JSON.stringify(st.settings)]]);
  KINDS.forEach(([arr,k])=>st[arr].forEach(o=>m.set(`${k}|${o.id}`,JSON.stringify(o))));
  return m;
}
function fromRows(rows){
  const st=emptyState();
  rows.forEach(r=>{if(r.kind==='settings')st.settings={...defaultSettings(),...r.data};else{const a=KINDS.find(x=>x[1]===r.kind);if(a)st[a[0]].push(r.data)}});
  return st;
}
/* この端末にも控えを置く（電波がなくても開けるように・すぐ表示できるように） */
const cacheKey=()=>'my-schedule-cache-'+(SESSION?.uid||'');
function writeCache(){try{localStorage.setItem(cacheKey(),JSON.stringify({S,snap:[...SNAP],dirty:DIRTY}))}catch(e){}}
function readCache(){try{const c=JSON.parse(localStorage.getItem(cacheKey())||'null');return c&&c.S?c:null}catch(e){return null}}

/* 変わった分だけ送る（生徒・レッスン・予定を1件ずつ） */
async function pushChanges(){
  if(!SESSION)return;
  const cur=itemsMap(S), up=[], del=[];
  cur.forEach((v,k)=>{if(SNAP.get(k)!==v){const [kind,id]=k.split('|');up.push({owner:SESSION.uid,kind,id,data:JSON.parse(v),_k:k,_v:v})}});
  SNAP.forEach((v,k)=>{if(!cur.has(k))del.push(k)});
  if(!up.length&&!del.length){DIRTY=false;writeCache();updSync();return}
  for(let i=0;i<up.length;i+=300){
    const part=up.slice(i,i+300);
    const {error}=await sb.from('ms_items').upsert(part.map(({_k,_v,...r})=>r),{onConflict:'owner,kind,id'});
    if(error)throw error;
    part.forEach(r=>SNAP.set(r._k,r._v));
  }
  const byKind={};del.forEach(k=>{const [kind,id]=k.split('|');(byKind[kind]=byKind[kind]||[]).push(id)});
  for(const [kind,ids] of Object.entries(byKind)){
    for(let i=0;i<ids.length;i+=200){
      const {error}=await sb.from('ms_items').delete().eq('kind',kind).in('id',ids.slice(i,i+200));
      if(error)throw error;
      ids.slice(i,i+200).forEach(id=>SNAP.delete(`${kind}|${id}`));
    }
  }
  DIRTY=false;writeCache();updSync();
}
let syncChain=Promise.resolve();
function save(){
  DIRTY=true;writeCache();
  syncChain=syncChain.catch(()=>{}).then(pushChanges).catch(e=>{DIRTY=true;writeCache();updSync();throw e});
  return syncChain;
}
/* ほかの端末で変えた分を読み込む（未送信の変更があるときは、先にこちらを送る） */
async function pull(){
  if(!SESSION)return;
  if(DIRTY){try{await save()}catch(e){return}}
  const {data,error}=await sb.from('ms_items').select('kind,id,data');
  if(error){updSync(true);return}
  const st=fromRows(data||[]);
  const changed=JSON.stringify([...itemsMap(st)].sort())!==JSON.stringify([...SNAP].sort())||!LOADED;
  S=st;SNAP=itemsMap(st);LOADED=true;
  LANGV=S.settings.lang||LANGV;
  let fix=false;
  if(!data.some(r=>r.kind==='settings')){fix=true;SNAP.delete('settings|main')}
  if(S.settings.tz!==deviceTz()){S.settings.tz=deviceTz();fix=true}
  writeCache();
  if(changed&&!g('layer').innerHTML)render();else updSync();
  if(fix)save().catch(()=>{});
}
function updSync(bad){const el=g('sync');if(!el)return;const b=bad||DIRTY;el.className='sync'+(b?' bad':'');el.textContent=b?L('未送信の変更があります（つながると送ります）','Unsent changes (will send when online)'):''}
addEventListener('online',()=>{if(DIRTY)save().then(()=>toast(L('✓ 未送信の変更を送りました','✓ Unsent changes saved'))).catch(()=>{})});
document.addEventListener('visibilitychange',()=>{if(document.visibilityState==='visible'&&SESSION)pull()});

/* ---------- ログイン（柔道ノートのコーチの ID とパスワード） ---------- */
async function enter(user){
  const {data:prof,error}=await sb.from('profiles').select('id,role,login_id,display_name').eq('id',user.id).maybeSingle();
  if(error){UI.loginErr=L('通信できませんでした。電波を確認してください。','Could not connect. Check your connection.');SESSION=null;render();return}
  if(!prof||prof.role!=='coach'){await sb.auth.signOut();SESSION=null;UI.loginErr=L('My schedule はコーチだけが使えます。','My schedule is for coaches only.');render();return}
  SESSION={uid:user.id,login:prof.login_id,name:prof.display_name};
  const c=readCache();
  if(c){S=c.S;S.pairs=S.pairs||[];SNAP=new Map(c.snap);DIRTY=!!c.dirty;LANGV=S.settings.lang||LANGV;LOADED=true}else{S=emptyState();SNAP=new Map();LOADED=false}
  render();
  await pull();
  refreshPushState();
}
async function start(){
  try{LANGV=localStorage.getItem('my-schedule-lang')||'ja'}catch(e){}
  const {data:{session}}=await sb.auth.getSession();
  if(!session){render();return}
  await enter(session.user);
}
function loginView(){
  return `<div class="login">${brand()}
    <section class="card">
      <div class="fld" style="margin:0"><label for="lg-id">${L('ID（柔道ノートと同じ）','ID (same as Judo Note)')}</label><input id="lg-id" autocomplete="username" autocapitalize="none" spellcheck="false"></div>
      <div class="fld" style="margin:0"><label for="lg-pw">${L('パスワード','Password')}</label><input id="lg-pw" type="password" autocomplete="current-password"></div>
      ${UI.loginErr?`<div class="err">${esc(UI.loginErr)}</div>`:''}
      <button class="btn block" data-act="login" ${UI.busy?'disabled':''}>${UI.busy?L('ログイン中…','Signing in…'):L('ログイン','Sign in')}</button>
      <p class="hint" style="margin:0">${L('柔道ノートのコーチのIDとパスワードで入れます。選手・保護者のIDでは入れません。','Use your Judo Note coach ID and password. Athlete and parent IDs can’t sign in.')}</p>
    </section>
    <div class="vseg" style="justify-self:center">${[['ja','日本語'],['en','English']].map(([k,n])=>`<button data-act="loginLang" data-v="${k}" aria-pressed="${LANGV===k}">${n}</button>`).join('')}</div>
  </div>`;
}

/* ---------- 通知（前の日の夜に翌日の予定） ---------- */
const pushSupported=()=>'serviceWorker' in navigator&&'PushManager' in window&&'Notification' in window;
const isIOS=/iPhone|iPad|iPod/.test(navigator.userAgent)||(navigator.platform==='MacIntel'&&navigator.maxTouchPoints>1);
const standalone=()=>matchMedia('(display-mode: standalone)').matches||navigator.standalone===true;
function b64ToU8(x){const b=atob((x+'='.repeat((4-x.length%4)%4)).replace(/-/g,'+').replace(/_/g,'/'));return Uint8Array.from(b,c=>c.charCodeAt(0))}
async function pushState(){
  if(!pushSupported())return isIOS&&!standalone()?'ios':'unsupported';
  if(Notification.permission==='denied')return 'denied';
  const reg=await navigator.serviceWorker.getRegistration();const sub=reg&&await reg.pushManager.getSubscription();
  if(!sub)return 'off';
  const {data}=await sb.from('ms_push_subs').select('endpoint').eq('endpoint',sub.endpoint);
  return data&&data.length?'on':'off';
}
async function refreshPushState(){try{UI.pushState=await pushState()}catch(e){UI.pushState='unsupported'}if(g('push-box'))g('push-box').innerHTML=pushBox()}
async function enablePush(){
  const perm=await Notification.requestPermission();if(perm!=='granted')throw new Error(L('通知が許可されませんでした','Notifications were not allowed'));
  const reg=await navigator.serviceWorker.register('sw.js');await navigator.serviceWorker.ready;
  const sub=(await reg.pushManager.getSubscription())||await reg.pushManager.subscribe({userVisibleOnly:true,applicationServerKey:b64ToU8(VAPID_PUBLIC)});
  const j=sub.toJSON();const {error}=await sb.rpc('ms_claim_push',{p_endpoint:j.endpoint,p_p256dh:j.keys.p256dh,p_auth:j.keys.auth});if(error)throw error;
}
async function disablePush(){const reg=await navigator.serviceWorker.getRegistration();const sub=reg&&await reg.pushManager.getSubscription();if(sub){await sb.from('ms_push_subs').delete().eq('endpoint',sub.endpoint);await sub.unsubscribe()}}
function pushBox(){
  const st=UI.pushState;
  return st==='on'?`<div class="chips" style="align-items:center"><span class="pill paid">${L('この端末で受け取る','On for this device')}</span><button class="btn sm ghost" data-act="pushTest">${L('テスト通知','Send test')}</button><button class="btn sm ghost" data-act="pushTomorrow">${L('明日の予定を今すぐ送る','Send tomorrow now')}</button><button class="btn sm ghost" data-act="pushOff" style="color:var(--due)">${L('この端末ではやめる','Turn off here')}</button></div>`
    :st==='off'?`<button class="btn sm" data-act="pushOn">${L('この端末で通知を受け取る','Get notifications on this device')}</button>`
    :st==='ios'?`<div class="hint">${L('iPhone・iPadでは、Safariの共有ボタン →「ホーム画面に追加」で追加したアプリから開くと、ここで通知をオンにできます。','On iPhone/iPad, add this app to your Home Screen (Safari share button → Add to Home Screen) and open it from there to turn on notifications.')}</div>`
    :st==='denied'?`<div class="hint" style="color:var(--due)">${L('この端末では通知がブロックされています。本体の設定で、このアプリの通知を許可してください。','Notifications are blocked on this device. Allow them for this app in the device settings.')}</div>`

/* 今月の見込み：受け取り済み＋まだの分（その月のレッスンの未払い）＋これからの予定（未払いの分） */
function projection(month){
  const got=income().filter(r=>r.date.startsWith(month)).reduce((a,r)=>a+r.amount,0);
  const inM=S.lessons.filter(l=>l.date.startsWith(month));
  const unpaid=inM.filter(isUnpaid).reduce((a,l)=>a+ +l.pay.amount,0);
  const plannedL=inM.filter(l=>l.status==='planned');
  const planned=plannedL.filter(l=>l.pay.mode==='per'&&!l.pay.paid).reduce((a,l)=>a+ +l.pay.amount,0);
  const plannedPack=dedupe(plannedL.filter(l=>l.pay.mode==='ticket')).length;
  const plannedCount=dedupe(plannedL).length;
  const doneCount=dedupe(inM.filter(l=>l.status==='done')).length;
  return {got,unpaid,planned,plannedPack,plannedCount,doneCount,total:got+unpaid+planned};
}
/* お金の流れ：受け取った日で数える */
function income(){
  const rows=[];
  S.lessons.forEach(l=>{if(l.pay.mode==='per'&&l.pay.paid)rows.push({date:l.pay.paidOn||l.date,sid:l.sid,kind:l.status==='cancelled'?L('キャンセル料','Cancellation fee'):l.gid?L('ペアレッスン','Pair lesson'):L('レッスン','Lesson'),lessonDate:l.date,amount:+l.pay.amount,method:l.pay.method})});
  S.packages.forEach(p=>{if(p.paid)rows.push({date:p.paidOn||p.date,sid:p.sid,kind:L(`回数券 ${p.count}回`,`${p.count}-lesson pack`),lessonDate:'',amount:+p.price,method:p.method})});
  return rows.sort((a,b)=>a.date.localeCompare(b.date));
}

/* 状態ごとの見た目 */
function stateOf(l){
  if(l.status==='cancelled')return 'off';
  if(l.status==='planned')return 'plan';
  if(l.pay.mode==='ticket')return 'ticket';
  if(l.pay.mode==='per')return l.pay.paid?'paid':(+l.pay.amount>0?'due':'paid');
  return 'paid';
}
function payPill(l){
  if(l.status==='cancelled'){
    const c=l.cancel||{};
    if(c.carry==='moved'){const t=byId(c.to);return `<span class="pill off">${L('キャンセル','Cancelled')} → ${t?md(t.date):L('振替','make-up')}</span>`}
    if(c.carry==='pending')return `<span class="pill warn">${L('キャンセル・振替待ち','Cancelled · make-up TBD')}</span>`;
    if(l.pay.mode==='per'&&+l.pay.amount>0)return `<span class="pill ${l.pay.paid?'off':'due'}">${L('キャンセル料','Cancel fee')} ${money(l.pay.amount)}</span>`;
    return `<span class="pill off">${L('キャンセル','Cancelled')}</span>`;
  }
  if(l.status==='planned')return `<span class="pill plan">${l.pay.mode==='ticket'?L('予定・回数券','Scheduled · pack'):l.pay.mode==='per'&&l.pay.paid?L(`予定・前払い済み ${money(l.pay.amount)}`,`Scheduled · prepaid ${money(l.pay.amount)}`):`${L('予定','Scheduled')} ${money(l.pay.amount)}`}</span>`;
  if(l.pay.mode==='ticket'){const p=S.packages.find(x=>x.id===l.pay.pid);return `<span class="pill ticket">${L('回数券','Pack')} ${ticketNo(l)}/${p?p.count:'?'}</span>`}
  if(l.pay.mode==='per')return l.pay.paid?`<span class="pill paid">${L('支払い済み','Paid')}</span>`:`<span class="pill due">${L('未払い','Unpaid')} ${money(l.pay.amount)}</span>`;
  return '';
}

/* 月のカレンダー（全体と生徒ごとで共通） */
function calendar(monthKey,sel,sid){
  const [y,m]=monthKey.split('-').map(Number);
  const first=new Date(y,m-1,1), start=new Date(first);start.setDate(1-first.getDay());
  let cells='';
  for(let i=0;i<42;i++){
    const d=new Date(start);d.setDate(start.getDate()+i);const k=ymd(d);
    if(i>=35&&d.getMonth()!==m-1)break;
    let evs,cnt;
    if(sid){const ls=sortL(S.lessons.filter(l=>l.date===k&&l.sid===sid));cnt=ls.length;
      evs=ls.slice(0,3).map(l=>`<span class="ev ${stateOf(l)}"><span class="t">${l.time}</span>${l.status==='cancelled'?L('休','Off'):l.status==='planned'?L('予定','Plan'):'✓'}</span>`).join('')}
    else{const its=itemsOn(k);cnt=its.length;
      evs=its.slice(0,3).map(it=>`<span class="ev ${it.cls}" ${it.c?`style="--c:${it.c}"`:''}>${it.allDay?'':`<span class="t">${fromMin(it.start)}</span>`}${esc(it.label)}</span>`).join('')+(its.length>3?`<span class="ev">+${its.length-3}</span>`:'')}
    cells+=`<button class="d ${d.getMonth()!==m-1?'out':''} ${k===today()?'today':''} ${k===sel?'sel':''}" data-act="${sid?'sday':'day'}" data-v="${k}" aria-label="${dl(k)} ${cnt}"><span class="n">${d.getDate()}</span>${evs}</button>`;
  }
  return `${sid?`<div class="calhead"><button data-act="scalMove" data-v="-1" aria-label="${L('前の月','Previous month')}">‹</button><h3>${ymTitle(y,m)}</h3><button data-act="scalMove" data-v="1" aria-label="${L('次の月','Next month')}">›</button></div>`:''}
    <div class="cal">${L(DOW,DOW_EN).map(d=>`<div class="dow">${d}</div>`).join('')}${cells}</div>
    ${legend(!sid)}`;
}

/* 時間の表（日・3日・週） */
const HOUR=48;
function layout(items){
  const res=[];let cluster=[],cols=[],end=-1;
  const flush=()=>{cluster.forEach(i=>i.n=cols.length);res.push(...cluster);cluster=[];cols=[];end=-1};
  items.slice().sort((a,b)=>a.start-b.start||b.end-a.end).forEach(it=>{
    if(cluster.length&&it.start>=end)flush();
    let c=cols.findIndex(e=>e<=it.start);if(c<0){c=cols.length;cols.push(it.end)}else cols[c]=it.end;
    it.col=c;cluster.push(it);end=Math.max(end,it.end);
  });flush();return res;
}
function blk(it){
  const top=it.start*HOUR/60, h=Math.max(20,(it.end-it.start)*HOUR/60-2);
  return `<button class="blk ${it.cls}" style="top:${top}px;height:${h}px;left:calc(${it.col/it.n*100}% + 1px);width:calc(${100/it.n}% - 3px);${it.c?`--c:${it.c}`:''}" data-act="${it.kind==='lesson'?'openLesson':'openEvent'}" data-id="${it.o.id}">${esc(it.label)}${it.kind==='lesson'&&it.o.gid?L(' (ペア)',' (pair)'):''}<small>${timeRange(it)}${it.kind==='lesson'?lessonMoneyTag(it.o):''}</small></button>`;
}
function lessonMoneyTag(l){
  if(l.status==='cancelled')return '';
  const grp=group(l), per=grp.filter(x=>x.pay.mode==='per');
  if(!per.length)return ' · '+L('回数券','pack');
  return ' · '+money(per.reduce((a,x)=>a+ +x.pay.amount,0));
}
function viewDays(){
  const n={day:1,'3day':3,week:7}[UI.view];
  let st=UI.anchor;if(UI.view==='week')st=addDays(st,-parse(st).getDay());
  return [...Array(n)].map((_,i)=>addDays(st,i));
}
function timeGrid(days){
  const t=today(), now=new Date(), nowM=now.getHours()*60+now.getMinutes();
  const head=days.map(d=>`<button data-act="gotoDay" data-v="${d}" class="${d===t?'today':''}">${dow(d)}<b>${parse(d).getDate()}</b></button>`).join('');
  const all=days.map(d=>`<div>${itemsOn(d).filter(i=>i.allDay).map(i=>`<button class="blk evt allday" style="--c:${i.c}" data-act="openEvent" data-id="${i.o.id}">${esc(i.label)}</button>`).join('')}</div>`).join('');
  const cols=days.map(d=>`<div class="tg-col ${d===t?'today':''}" data-act="slot" data-v="${d}">${layout(itemsOn(d).filter(i=>!i.allDay)).map(blk).join('')}${d===t?`<div class="now" style="top:${nowM*HOUR/60}px"></div>`:''}</div>`).join('');
  const times=[...Array(23)].map((_,i)=>`<span style="top:${(i+1)*HOUR}px">${i+1}:00</span>`).join('');
  return `<div class="tg" style="--n:${days.length};--h:${HOUR}px"><div class="tg-head"><div></div>${head}</div><div class="tg-all"><div class="lab">${L('終日','All day')}</div>${all}</div><div class="tg-body" id="tgb"><div class="tg-grid"><div class="tg-times">${times}</div>${cols}</div></div></div>
  <p class="hint" style="margin:8px 0 0">${L('空いている時間をタップすると、その時刻で予定を追加できます。','Tap an empty time slot to add an event at that time.')}</p>`;
}
function rangeTitle(ds){
  const a=parse(ds[0]),b=parse(ds[ds.length-1]);
  if(LANGV==='en'){const f=(d,o)=>d.toLocaleDateString('en-US',o);
    if(ds.length===1)return f(a,{weekday:'short',month:'short',day:'numeric',year:'numeric'});
    return `${f(a,{month:'short',day:'numeric'})} – ${f(b,a.getMonth()===b.getMonth()?{day:'numeric'}:{month:'short',day:'numeric'})}, ${b.getFullYear()}`}
  return `${a.getFullYear()}年${a.getMonth()+1}月`+(ds.length>1?` ${a.getDate()}日–${a.getMonth()!==b.getMonth()?(b.getMonth()+1)+'月':''}${b.getDate()}日`:` ${a.getDate()}日(${dow(ds[0])})`);
}
function cal(){
  const V=[['day',L('日','Day')],['3day',L('3日','3 days')],['week',L('週','Week')],['month',L('月','Month')]];
  let title;
  if(UI.view==='month'){const [y,m]=UI.cal.split('-').map(Number);title=ymTitle(y,m)}else title=rangeTitle(viewDays());
  const bar=`<div class="vbar"><button class="navb" data-act="goToday">${L('今日','Today')}</button><button class="navb" data-act="calNav" data-v="-1" aria-label="${L('前へ','Previous')}">‹</button><button class="navb" data-act="calNav" data-v="1" aria-label="${L('次へ','Next')}">›</button><h3 class="grow">${title}</h3>
    <div class="vseg">${V.map(([k,n])=>`<button data-act="view" data-v="${k}" aria-pressed="${UI.view===k}">${n}</button>`).join('')}</div></div>
    <div class="vbar">${segHtml('filter',UI.filter)}</div>`;
  if(UI.view!=='month')return `<section class="card">${bar}${timeGrid(viewDays())}${legend(true)}</section>`;
  const dlist=itemsOn(UI.day);
  return `<div class="grid2" style="grid-template-columns:${innerWidth>=900?'1.6fr 1fr':'1fr'}">
  <section class="card">${bar}${calendar(UI.cal,UI.day)}</section>
  <section class="card"><h2>${dl(UI.day)}</h2>${dlist.length?dlist.map(it=>itemRow(it,false)).join(''):`<div class="empty">${L('この日の予定はありません。','Nothing on this day.')}</div>`}
    <div style="margin-top:10px"><button class="btn ghost sm" data-act="newEvent" data-date="${UI.day}">${L('＋ この日に予定を追加','＋ Add event on this day')}</button></div></section>
  </div>`;
}

function moneyView(){
  const rows=income();
  const [y,m]=UI.month.split('-').map(Number);
  const months=[];for(let i=5;i>=0;i--){const d=new Date(y,m-1-i,1);months.push(`${d.getFullYear()}-${pad(d.getMonth()+1)}`)}
  const sums=months.map(k=>rows.filter(r=>r.date.startsWith(k)).reduce((a,r)=>a+r.amount,0));
  const pjs=months.map(k=>projection(k));
  const max=Math.max(...pjs.map(p=>p.total),1);
  const PJ=projection(UI.month), cur=UI.month===today().slice(0,7), future=UI.month>today().slice(0,7);
  const plist=dedupe(sortL(S.lessons.filter(l=>l.date.startsWith(UI.month)&&(l.status==='planned'||isUnpaid(l)))));
  const mr=rows.filter(r=>r.date.startsWith(UI.month));
  const total=mr.reduce((a,r)=>a+r.amount,0);
  const cnt=dedupe(done().filter(l=>l.date.startsWith(UI.month))).length;
  const canc=dedupe(S.lessons.filter(l=>l.status==='cancelled'&&l.date.startsWith(UI.month))).length;
  const by={};mr.forEach(r=>{by[r.sid]=(by[r.sid]||0)+r.amount});
  const meth={};mr.forEach(r=>{const k=r.method?tMethod(r.method):'—';meth[k]=(meth[k]||0)+r.amount});
  return `<section class="card" style="margin-bottom:14px">
    <div class="calhead"><button data-act="monMove" data-v="-1" aria-label="${L('前の月','Previous month')}">‹</button><h3>${L(`${y}年${m}月の受け取り`,`Received · ${ymTitle(y,m)}`)}</h3><button data-act="monMove" data-v="1" aria-label="${L('次の月','Next month')}">›</button></div>

const methodChips=(act,cur,sid)=>`<div class="chips">${METHODS.map(m=>`<button class="chip" data-act="${act}" ${sid?`data-sid="${sid}"`:''} data-v="${m}" aria-pressed="${cur===m}">${tMethod(m)}</button>`).join('')}</div>`;

function defaultPay(sid,n,dur){const a=activePkg(sid);return a.length&&n<2?{mode:'ticket',pid:a[0].id}:{mode:'per',amount:priceFor(sid,dur,n),paid:false}}
function payState(p,sid,n,dur){
  if(!p)p=defaultPay(sid,n,dur);
  return {mode:p.mode==='ticket'?'ticket':p.paid?'paid':'due',method:p.method||'現金',pid:p.pid||'',amount:p.amount??priceFor(sid,dur,n),paidOn:p.paidOn||''};
}

function refreshForm(){
  const n=F.sids.length;
  g('f-type').textContent=n>=2?L(`ペアレッスン：1時間 ${money(S.settings.pair60)}（2人の合計）を半分ずつ`,`Pair lesson: ${money(S.settings.pair60)}/hour for both, split in half`):L(`マンツーマン：${rateLabel(stu(F.sids[0]))}`,`Private: ${rateLabel(stu(F.sids[0]))}`);
  g('f-prev').innerHTML=F.sids.map(sid=>{const last=sortL(S.lessons.filter(l=>l.sid===sid&&l.status==='done'&&!Object.values(F.ids).includes(l.id))).pop();
    return last&&last.next?`<div class="prev"><b>${esc(stu(sid).name)}・${L(`前回 ${md(last.date)} の「次回やること」`,`“Next time” from ${md(last.date)}`)}</b>${esc(last.next)}</div>`:''}).join('');
  const td=F.sids.flatMap(sid=>(stu(sid).todos||[]).filter(t=>!t.done).map(t=>({...t,sid})));
  g('f-todos').innerHTML=td.length?`<div class="fld"><span class="lb">${L('次やること・やりたいこと','To-do & wishes')} <span class="hint" style="font-weight:400">— ${L('今日やったものをタップ','tap what you covered today')}</span></span><div class="chips">${td.map(t=>`<button class="chip" data-act="fTodo" data-id="${t.id}" aria-pressed="${F.todo.has(t.id)}">${n>1?esc(shortName(stu(t.sid).name))+': ':''}${esc(t.text)}</button>`).join('')}</div></div>`:'';
  renderPay();
}
function renderPay(){
  const n=F.sids.length;
  g('f-pay').innerHTML=F.sids.map(sid=>{
    const P=F.pay[sid], s=stu(sid);
    const c=F.carry[sid]?byId(F.carry[sid]):null;
    const cPaid=c&&c.pay.mode==='per'&&c.pay.paid, cTicket=c&&c.pay.mode==='ticket';
    const cl=d=>L(`${md(d)} にキャンセルした分の振替として入れる`,`Count as the make-up for ${md(d)}`);
    const carryHtml=c?`<label class="check"><input type="checkbox" data-act="fCarry" data-sid="${sid}" checked> ${cl(c.date)}</label>`:(pendingOf(sid).length&&F.isNew?`<label class="check"><input type="checkbox" data-act="fCarry" data-sid="${sid}"> ${cl(pendingOf(sid)[0].date)}</label>`:'');
    if(c&&(cPaid||cTicket))return `<div class="paybox">${n>1?`<b>${esc(s.name)}</b>`:''}${carryHtml}<div class="hint">${cPaid?L(`代金は ${md(c.date)} の分でいただき済み（${money(c.pay.amount)}・${esc(tMethod(c.pay.method))}）なので、この回は支払い済みになります。`,`Already paid for ${md(c.date)} (${money(c.pay.amount)}, ${esc(tMethod(c.pay.method))}), so this lesson counts as paid.`):L('回数券はキャンセルの日には減っていません。この回で1回分を使います。','The pack wasn’t used on the cancelled day. This lesson uses one.')}</div></div>`;
    const pk=S.packages.filter(p=>p.sid===sid&&(left(p)>0||p.id===P.pid));
    if(P.mode==='ticket'&&!pk.some(p=>p.id===P.pid))P.pid=pk[0]?.id||'';
    return `<div class="paybox">${n>1?`<b>${esc(s.name)}</b>`:''}${carryHtml}
      <div class="seg">${[['paid',L('支払い済み','Paid')],['due',L('未払い','Unpaid')],['ticket',L('回数券','Pack')]].map(([k,nm])=>`<button data-act="fMode" data-sid="${sid}" data-v="${k}" aria-pressed="${P.mode===k}">${nm}</button>`).join('')}</div>
      ${P.mode==='ticket'?(pk.length?`<div class="chips">${pk.map(p=>`<button class="chip" data-act="fPkg" data-sid="${sid}" data-id="${p.id}" aria-pressed="${p.id===P.pid}">${L(`${p.count}回券（${md(p.date)}）残り${left(p)}回`,`${p.count}-pack (${md(p.date)}) · ${left(p)} left`)}</button>`).join('')}</div><div class="hint">${L('レッスンをした日に1回分減ります。予定やキャンセルでは減りません。','One is used on the day the lesson happens. Scheduling or cancelling doesn’t use one.')}</div>`
        :`<div class="hint">${L('使える回数券がありません。生徒の画面の「＋ 回数券を追加」から登録できます。','No pack available. Add one from the student page (“＋ Add pack”).')}</div>`)
      :`<div class="two"><div class="fld" style="margin:0"><label for="f-amt-${sid}">${L('金額（$）','Amount ($)')}</label><input type="number" class="f-amount" id="f-amt-${sid}" data-sid="${sid}" inputmode="decimal" min="0" value="${esc(P.amount)}"></div></div>
        ${P.mode==='paid'?methodChips('fMethod',P.method,sid):`<div class="hint">${L('ホームの「まだいただいていない代金」に出ます（予定のうちは出ません）。','Shows under “Payments due” on Home (not while still scheduled).')}</div>`}`}</div>`}).join('');
}
/* 記録の画面で生徒（ペア）を選び直す */
function setFSids(ids){
  F.sids=ids;
  document.querySelectorAll('[data-act="fStu"]').forEach(x=>x.setAttribute('aria-pressed',F.sids.includes(x.dataset.id)));
  document.querySelectorAll('[data-act="fPair"]').forEach(x=>x.setAttribute('aria-pressed',samePair(S.pairs.find(q=>q.id===x.dataset.id),F.sids)));
  const d=durOf('f')||60;
  F.sids.forEach(x=>{if(!F.pay[x]||F.sids.length>1&&F.pay[x].mode==='ticket'&&!F.ids[x])F.pay[x]=payState(null,x,F.sids.length,d)});
  recalcAmounts();
  F.sids.forEach(x=>{if(F.isNew&&!F.carry[x]&&pendingOf(x)[0])F.carry[x]=pendingOf(x)[0].id});
  Object.keys(F.carry).forEach(x=>{if(!F.sids.includes(x))delete F.carry[x]});
  refreshForm();
}
function recalcAmounts(){const d=durOf('f')||60;F.sids.forEach(sid=>{F.pay[sid].amount=priceFor(sid,d,F.sids.length)});}

function saveLesson(as){
  if(!F.sids.length){toast(L('生徒を選んでください','Pick a student'));return}
  const status=as==='planned'?'planned':'done';
  for(const sid of F.sids){const P=F.pay[sid];if(!F.carry[sid]&&P.mode==='ticket'&&!P.pid){toast(L(`${stu(sid).name}：回数券を選んでください`,`${stu(sid).name}: pick a pack`),L('または「支払い済み／未払い」に切り替えてください','or switch to Paid / Unpaid'));return}}
  const date=g('f-date').value||today(), time=readT('f-st'), dur=durOf('f');
  if(dur<=0){toast(L('終了の時刻を開始より後にしてください','End time must be after the start'));return}
  const scope=document.querySelector('input[name="scope"]:checked')?.value;
  const gid=F.sids.length>1?(F.gid||uid()):null;
  Object.entries(F.ids).forEach(([sid,id])=>{if(!F.sids.includes(sid))S.lessons=S.lessons.filter(l=>l.id!==id)});
  const shared={date,time,dur,status,gid,place:g('f-place').value.trim(),waza:[...F.waza],content:g('f-content').value.trim(),next:g('f-next').value.trim(),plan:g('f-plan').value.trim()};
  const saved=[];
  F.sids.forEach(sid=>{
    const id=F.ids[sid]||uid(), old=byId(id);
    const P=F.pay[sid];
    const pay=P.mode==='ticket'?{mode:'ticket',pid:P.pid}:{mode:'per',amount:+P.amount||0,paid:P.mode==='paid',method:P.mode==='paid'?P.method:'',paidOn:P.mode==='paid'?(P.paidOn||today()):''};
    const rec={...(old||{}),id,sid,...shared,pay,cancel:null,from:old?.from||null};
    const c=F.carry[sid]?byId(F.carry[sid]):null;
    if(c)applyCarry(c,rec);
    if(old)Object.assign(old,rec);else S.lessons.push(rec);
    saved.push(rec);
    if(status==='done')(stu(sid).todos||[]).forEach(t=>{if(F.todo.has(t.id)){t.done=true;t.doneOn=date}});
  });
  if(scope==='after'){const first=byId(Object.values(F.ids)[0]);laterInSeries(first).forEach(x=>{if(x.status==='planned'){x.time=time;x.dur=dur;x.place=shared.place;if(x.pay.mode==='per'&&!x.pay.paid)x.pay.amount=priceFor(x.sid,dur,group(x).length)}})}
  let booked='';
  if(g('f-book')?.checked&&g('f-bdate').value){
    const bd=g('f-bdate').value, bg=F.sids.length>1?uid():null;
    F.sids.forEach(sid=>S.lessons.push({id:uid(),sid,gid:bg,date:bd,time:readT('f-bt'),place:shared.place,dur,status:'planned',waza:[],content:'',next:'',plan:shared.next,pay:defaultPay(sid,F.sids.length,dur),cancel:null,from:null}));

const DURS=[30,45,60,90,120];
function durChips(P,cur){return `<div class="fld ${P==='e'?'e-times':''}" style="margin-top:-4px"><span class="lb">${L('長さ','Length')}</span><div class="chips" id="${P}-durs">${DURS.map(d=>`<button class="chip" data-act="durPick" data-p="${P}" data-v="${d}" aria-pressed="${d===cur}">${d}${L('分',' min')}</button>`).join('')}</div></div>`}
function updDurChips(P){const d=durOf(P);document.querySelectorAll(`#${P}-durs .chip`).forEach(x=>x.setAttribute('aria-pressed',+x.dataset.v===d))}
const r5=t=>fromMin(Math.round(toMin(t||'16:00')/5)*5);
const TIMES=[...Array(288)].map((_,i)=>fromMin(i*5));
function timeSel(id,val){const v=r5(val);return `<select id="${id}" class="tsel1" aria-label="${L('時刻','Time')}">${TIMES.map(t=>`<option ${t===v?'selected':''}>${t}</option>`).join('')}</select>`}
const readT=id=>g(id).value;
function setT(id,t){g(id).value=r5(t)}
const durOf=P=>toMin(readT(P+'-en'))-toMin(readT(P+'-st'));
function repeatDates(start,rule,mode,count,until){
  if(rule==='none')return [start];
  const out=[], d0=parse(start), day=d0.getDate(), lim=addDays(start,730);
  for(let k=0;k<400&&out.length<150;k++){
    let d;
    if(rule==='monthly'){d=new Date(d0.getFullYear(),d0.getMonth()+k,day);if(d.getDate()!==day)continue}
    else{d=new Date(d0);d.setDate(day+k*({daily:1,weekly:7,biweekly:14}[rule]))}
    const s=ymd(d);
    if(s>lim)break;
    if(mode==='until'&&s>until)break;
    if(mode==='count'&&out.length>=count)break;
    out.push(s);
  }
  return out;
}
function repeatLabel(rule,date){const d=parse(date),w=d.getDay();return {none:L('繰り返さない','Does not repeat'),daily:L('毎日','Daily'),weekly:L(`毎週 ${DOW[w]}曜日`,`Weekly on ${DOW_LONG[w]}`),biweekly:L(`隔週 ${DOW[w]}曜日`,`Every 2 weeks on ${DOW_LONG[w]}`),monthly:L(`毎月 ${d.getDate()}日`,`Monthly on day ${d.getDate()}`)}[rule]}
function laterInSeries(x){return x&&x.seriesId?S.lessons.concat(S.events).filter(y=>y.seriesId===x.seriesId&&y.id!==x.id&&y.date>x.date&&(x.sid?y.sid===x.sid:true)):[]}

function saveEvent(){
  const E=F.e, isL=E.tab==='lesson';
  const date=g('e-date').value||today();
  const allDay=!isL&&g('e-allday').checked;
  const time=allDay?'':readT('e-st'), dur=allDay?0:durOf('e');
  if(!allDay&&dur<=0){toast(L('終了の時刻を開始より後にしてください','End time must be after the start'));return}
  const place=g('e-place').value.trim();
  const when=(d,t)=>`${dl(d)}${allDay?' '+L('終日','all day'):' '+t}`;
  if(E.ev){
    const title=g('e-title').value.trim()||evtName(E.type);
    const scope=document.querySelector('input[name="scope"]:checked')?.value;
    const edate=allDay&&g('e-edate').value>date?g('e-edate').value:'';
    Object.assign(E.ev,{title,type:E.type,date,time,dur,allDay,edate,place,memo:g('e-memo').value.trim()});
    if(scope==='after')laterInSeries(E.ev).forEach(x=>Object.assign(x,{title,type:E.type,time,dur,allDay,place,memo:E.ev.memo}));
    run(()=>{save();closeSheet();render()},L('予定を保存しました','Event saved'),scope==='after'?L('これ以降の予定もまとめて変えました','All following events updated too'):'');return;
  }
  const rule=g('rp').value, dates=repeatDates(date,rule,g('rp-mode').value,Math.max(1,+g('rp-count').value||1),g('rp-until').value);
  const series=dates.length>1?uid():null;
  const rep=dates.length>1?L(`${repeatLabel(rule,date)}で${dates.length}回分`,`${repeatLabel(rule,date)}, ${dates.length} times`):'';
  if(isL){
    if(!E.sids.length){toast(L('生徒を選んでください','Pick a student'));return}
    const n=E.sids.length, plan=g('e-plan').value.trim();
    const useC=E.carryObj&&g('e-usecarry')?.checked;
    dates.forEach((d,i)=>{
      const gid=n>1?uid():null;
      E.sids.forEach(sid=>{
        const rec={id:uid(),sid,gid,seriesId:series,date:d,time,dur,place,status:'planned',waza:[],content:'',next:'',plan:i===0?plan:'',pay:defaultPay(sid,n,dur),cancel:null,from:null};
        if(i===0&&useC&&E.carryObj.sid===sid)applyCarry(E.carryObj,rec);
        S.lessons.push(rec);
      });
    });
    run(()=>{save();closeSheet();UI.anchor=date;render()},L('予定を入れました','Scheduled'),`${names(E.sids.map(sid=>({sid})))} · ${rep||when(date,time)}`);
  }else{
    const title=g('e-title').value.trim()||evtName(E.type);
    const span=allDay&&g('e-edate').value>date?Math.round((parse(g('e-edate').value)-parse(date))/864e5):0;
    dates.forEach(d=>S.events.push({id:uid(),type:E.type,title,date:d,time,dur,allDay,edate:span?addDays(d,span):'',place,memo:g('e-memo').value.trim(),seriesId:series}));
    run(()=>{save();closeSheet();UI.anchor=date;render()},L('予定を入れました','Event added'),`${title} · ${rep||when(date,time)}`);
  }
}
function applyCarry(c,rec){
  if(c.pay.mode==='per'&&c.pay.paid)rec.pay={...c.pay};
  else if(c.pay.mode==='ticket'){const pk=S.packages.find(p=>p.id===c.pay.pid);if(pk&&left(pk)>0&&!rec.gid)rec.pay={mode:'ticket',pid:pk.id}}
  if(c.plan&&!rec.plan.includes(c.plan))rec.plan=[c.plan,rec.plan].filter(Boolean).join('\n');
  c.pay={mode:'none'};c.cancel.carry='moved';c.cancel.to=rec.id;rec.from=c.id;
}

    if(t.pay.mode==='per'&&!t.pay.paid){t.pay={...c.pay}}
    else{c.cancel.carry='pending';return false} // 次も支払い済みなら、振替待ちとして残す
  }
  c.pay={mode:'none'};c.cancel.carry='moved';c.cancel.to=t.id;t.from=c.id;return true;
}
function cancelSave(){
  const l=byId(F.cxl.id), grp=group(l);
  const who=document.querySelector('input[name="who"]:checked')?.value||'all';
  const opt=document.querySelector('input[name="carry"]:checked').value;
  const targets=who==='all'?grp:grp.filter(x=>x.sid===who);
  const ids=targets.map(x=>x.id);
  let msg='';
  const ng=opt==='new'&&targets.length>1?uid():null;
  targets.forEach(c=>{
    c.status='cancelled';c.cancel={reason:F.cxl.reason,on:today(),carry:'none'};
    if(opt==='next'){const t=nextPlanned(c,ids);if(t){moveTo(c,t);msg=L(`次の予定 ${md(t.date)} に繰り越しました`,`Carried over to ${dl(t.date)}`)}else{c.cancel.carry='pending';msg=L('振替待ちにしました','Marked as pending make-up')}}
    else if(opt==='new'){const d=g('cx-date').value||addDays(c.date,7);const t={id:uid(),sid:c.sid,gid:ng,date:d,time:readT('cx-t'),place:c.place||'',seriesId:null,dur:c.dur,status:'planned',waza:[],content:'',next:'',plan:'',pay:defaultPay(c.sid,targets.length,c.dur),cancel:null,from:null};S.lessons.push(t);moveTo(c,t);msg=L(`振替を ${dl(d)} に入れました`,`Make-up scheduled: ${dl(d)}`)}
    else if(opt==='later'){c.cancel.carry='pending';msg=L('ホームの「振替待ち」に残しました','Listed on Home under make-ups to schedule')}
    else{
      if(g('cx-fee').checked){const wasPaid=c.pay.mode==='per'&&c.pay.paid;c.pay={mode:'per',amount:+g('cx-amt').value||0,paid:wasPaid,method:wasPaid?c.pay.method:'',paidOn:wasPaid?c.pay.paidOn:''};c.cancel.fee=true;msg=wasPaid?L('前払い分をキャンセル料にしました','Prepayment kept as the cancellation fee'):L('キャンセル料を未払いに入れました','Cancellation fee added to payments due')}
      else{c.pay={mode:'none'};msg=L('繰り越しはしません','Not carried over')}
    }
  });
  if(who!=='all'){const rest=grp.filter(x=>x.sid!==who);if(rest.length===1){rest[0].gid=null;if(rest[0].pay.mode==='per'&&!rest[0].pay.paid)rest[0].pay.amount=priceFor(rest[0].sid,rest[0].dur,1)}targets.forEach(x=>x.gid=null)}
  run(()=>{save();closeSheet();render()},L('キャンセルにしました','Lesson cancelled'),msg);
}

    case 'view':UI.tgScroll=null;if(v==='month'){UI.cal=UI.anchor.slice(0,7);UI.day=UI.anchor}else if(UI.view==='month')UI.anchor=UI.day;UI.view=v;render();break;
    case 'filter':UI.filter=v;render();break;
    case 'goToday':UI.anchor=today();UI.day=today();UI.cal=today().slice(0,7);UI.tgScroll=null;render();break;
    case 'calNav':UI.tgScroll=null;if(UI.view==='month')UI.cal=monthShift(UI.cal,+v);else UI.anchor=addDays(UI.anchor,+v*{day:1,'3day':3,week:7}[UI.view]);render();break;
    case 'gotoDay':UI.anchor=v;UI.view='day';render();break;
    case 'slot':{const r=b.getBoundingClientRect();const mins=Math.floor((e.clientY-r.top)/HOUR*60/15)*15;eventForm({date:v,time:fromMin(mins)});break}
    case 'saveSettings':S.settings={...S.settings,solo30:+g('st-solo').value||50,pair60:+g('st-pair').value||100,};run(()=>{save();closeSheet();render()},L('料金を保存しました','Rates saved'),L(`30分 ${money(S.settings.solo30)}・ペア1時間 ${money(S.settings.pair60)}`,`${money(S.settings.solo30)}/30 min · pair ${money(S.settings.pair60)}/hour`));break;
    case 'newLesson':lessonForm(null,{date:b.dataset.date,sid:b.dataset.sid});break;
    case 'openLesson':lessonForm(byId(id));break;
    case 'close':case 'closeBg':closeSheet();break;
    case 'day':UI.day=v;UI.anchor=v;render();break;
    case 'sday':UI.sday=UI.sday===v?null:v;render();break;
    case 'scalMove':UI.scal=monthShift(UI.scal,+v);UI.sday=null;render();break;
    case 'monMove':UI.month=monthShift(UI.month,+v);render();break;
    case 'openStu':UI.tab='stu';UI.sid=id;UI.sday=null;UI.scal=today().slice(0,7);render();scrollTo(0,0);break;
    case 'backStu':UI.sid=null;render();break;
    case 'toggleDone':UI.showDone=!UI.showDone;render();break;
    case 'todoAdd':{const inp=g('todo-new'),t=inp.value.trim();if(!t){inp.focus();return}const s=stu(UI.sid);(s.todos=s.todos||[]).push({id:uid(),text:t,done:false});run(()=>{save();render();g('todo-new')?.focus()},L('追加しました','Added'),L('次のレッスンを記録するときに出てきます','It will show up when you log the next lesson'));break}
    case 'todoToggle':{const s=stu(UI.sid),t=s.todos.find(x=>x.id===id);t.done=!t.done;t.doneOn=t.done?today():'';save().catch(()=>{});setTimeout(()=>{render();toast(t.done?L('✓ やったことに移しました','✓ Moved to done'):L('まだのリストに戻しました','Moved back to the to-do list'))},t.done?350:0);break}
    case 'todoDel':{const s=stu(UI.sid);s.todos=s.todos.filter(x=>x.id!==id);save().catch(()=>{});render();toast(L('消しました','Deleted'));break}
    case 'newStu':stuForm();break;
    case 'editStu':stuForm(stu(id));break;
    case 'saveStu':{
      const name=g('s-name').value.trim();if(!name){toast(L('名前を入れてください','Enter a name'));return}
      const custom=document.querySelector('input[name="price"]:checked').value==='custom';
      const d={name,kana:g('s-kana').value.trim(),custom30:custom?(+g('s-c30').value||S.settings.solo30):null,dur:+g('s-dur').value||60,memo:g('s-memo').value.trim()};
      if(id)Object.assign(stu(id),d);else S.students.push({id:uid(),color:COLORS[S.students.length%COLORS.length],todos:[],...d});
      run(()=>{save();closeSheet();render()},id?L('保存しました','Saved'):L(`${name} さんを追加しました`,`Added ${name}`));break}
    case 'newPkg':pkgForm(sid);break;
    case 'pkgN':document.querySelectorAll('[data-act="pkgN"]').forEach(x=>x.setAttribute('aria-pressed',x===b));g('k-count').value=v;g('k-price').value=b.dataset.per*v;break;
    case 'savePkg':{
      const paid=g('k-paid').checked;
      const p={id:uid(),sid,count:+g('k-count').value||10,price:+g('k-price').value||0,date:g('k-date').value||today(),paid,method:paid?F.method:''};
      if(paid)p.paidOn=p.date;
      S.packages.push(p);
      S.lessons.forEach(l=>{if(l.sid===p.sid&&l.status==='planned'&&!l.gid&&!(l.pay.mode==='per'&&l.pay.paid)&&l.pay.mode!=='ticket')l.pay={mode:'ticket',pid:p.id}});
      run(()=>{save();closeSheet();render()},L(`${p.count}回券を追加しました`,`Added a ${p.count}-lesson pack`),paid?`${money(p.price)} (${tMethod(p.method)})`:L('未払いとしてホームに出ます','Shows on Home as payment due'));break}
    case 'receive':receiveForm('stu',sid);break;
    case 'receivePkg':receiveForm('pkg',id);break;
    case 'recvPick':{const on=b.getAttribute('aria-pressed')!=='true';b.setAttribute('aria-pressed',on);F.recv.ids=on?[...F.recv.ids,id]:F.recv.ids.filter(x=>x!==id);
      g('r-btn').textContent=recvLabel(F.recv.ids.reduce((s,i)=>s+ +byId(i).pay.amount,0));break}
    case 'saveRecv':{
      const r=F.recv,t=today();let sum=0;
      if(r.kind==='stu'){if(!r.ids.length){toast(L('受け取った回を選んでください','Pick the lessons paid for'));return}r.ids.forEach(i=>{const l=byId(i);Object.assign(l.pay,{paid:true,method:F.method,paidOn:t});sum+= +l.pay.amount})}
      else{const p=S.packages.find(x=>x.id===r.id);Object.assign(p,{paid:true,method:F.method,paidOn:t});sum=p.price}
      run(()=>{save();closeSheet();render()},recvLabel(sum),L(`${tMethod(F.method)}・ありがとうございました`,`${tMethod(F.method)} · thank you`));break}
    case 'fStu':{
      const on=!F.sids.includes(id);
      if(on&&F.sids.length>=2){toast(L('ペアは2人までです','A pair is two students'),L('先にどちらかを外してください','Deselect one first'));return}
      if(!on&&F.sids.length===1)return;
      setFSids(on?[...F.sids,id]:F.sids.filter(x=>x!==id));break}
    case 'fWaza':{const on=!F.waza.includes(v);F.waza=on?[...F.waza,v]:F.waza.filter(x=>x!==v);b.setAttribute('aria-pressed',on);break}
    case 'fTodo':{const on=!F.todo.has(id);on?F.todo.add(id):F.todo.delete(id);b.setAttribute('aria-pressed',on);break}
    case 'fMode':F.pay[sid].mode=v;renderPay();break;
    case 'fPkg':F.pay[sid].pid=id;renderPay();break;
    case 'fMethod':F.pay[sid].method=v;b.parentElement.querySelectorAll('.chip').forEach(x=>x.setAttribute('aria-pressed',x===b));break;
    case 'fMethodK':F.method=v;b.parentElement.querySelectorAll('.chip').forEach(x=>x.setAttribute('aria-pressed',x===b));break;
    case 'fCarry':{if(b.checked)F.carry[sid]=pendingOf(sid)[0]?.id;else delete F.carry[sid];renderPay();break}
    case 'saveLesson':saveLesson(b.dataset.as);break;
    case 'delLesson':{
      if(!F.confirmDel){F.confirmDel=true;b.textContent=L('もう一度押すと消えます','Tap again to delete');return}
      const ids=Object.values(F.ids);
      if(document.querySelector('input[name="scope"]:checked')?.value==='after'){const f=byId(ids[0]);laterInSeries(f).filter(x=>x.status==='planned').forEach(x=>ids.push(x.id))}
      S.lessons.forEach(l=>{if(l.cancel?.to&&ids.includes(l.cancel.to)){l.cancel.carry='pending';delete l.cancel.to}});
      S.lessons=S.lessons.filter(l=>!ids.includes(l.id));run(()=>{save();closeSheet();render()},L('消しました','Deleted'));break}
    case 'cancelOpen':cancelForm(id);break;
    case 'cxReason':F.cxl.reason=v;b.parentElement.querySelectorAll('.chip').forEach(x=>x.setAttribute('aria-pressed',x===b));break;
    case 'cancelSave':cancelSave();break;
    case 'uncancel':{const l=byId(id);
      if(l.cancel?.carry==='moved'){const t=byId(l.cancel.to);if(t&&t.from===l.id){if(t.pay.mode==='per'&&t.pay.paid&&l.pay.mode!=='per'){l.pay={...t.pay};t.pay=defaultPay(t.sid,1,t.dur)}t.from=null}}
      if(l.pay.mode==='none')l.pay=defaultPay(l.sid,1,l.dur);
      l.status='planned';l.cancel=null;run(()=>{save();closeSheet();render()},L('予定に戻しました','Back to scheduled'));break}
    case 'schedCarry':{const c=byId(id);closeSheet();eventForm({kind:'lesson',sid:c.sid,carry:c.id,date:addDays(today(),1),time:c.time});break}
    case 'csv':csvSheet(v);break;
    case 'dlCsv':{const blob=new Blob(['\ufeff'+g('csv-text').value],{type:'text/csv;charset=utf-8'});const u=URL.createObjectURL(blob);const a2=document.createElement('a');a2.href=u;a2.download=b.dataset.name;document.body.appendChild(a2);a2.click();a2.remove();setTimeout(()=>URL.revokeObjectURL(u),4000);toast(L('✓ 保存しました','✓ Saved'));break}
    case 'copyCsv':{const ta=g('csv-text');const fb=()=>{ta.select();toast(L('選択しました','Selected'),L('⌘C（コピー）で写せます','Press ⌘C to copy'))};
      if(navigator.clipboard)navigator.clipboard.writeText(ta.value).then(()=>toast(L('✓ コピーしました','✓ Copied'))).catch(fb);else fb();break}
  }
});
document.addEventListener('input',e=>{
  if(e.target.classList.contains('f-amount'))F.pay[e.target.dataset.sid].amount=e.target.value;
});
document.addEventListener('change',e=>{
  const id=e.target.id;
  if(id==='f-book'){g('f-bookbox').hidden=!e.target.checked;g('f-bookhint').hidden=!e.target.checked}
  if(id==='k-paid')g('k-mbox').hidden=!e.target.checked;
  if(id==='f-date'&&g('f-bdate'))g('f-bdate').value=addDays(e.target.value,7);
  const tm=id.match(/^(f|e)-(st|en)$/);
  if(tm){const P=tm[1];
    if(tm[2]==='st')setT(P+'-en',fromMin(toMin(readT(P+'-st'))+F.tdur));else F.tdur=durOf(P);
    updDurChips(P);
    if(P==='f'){recalcAmounts();renderPay()}else refreshEv()}
  if(id==='e-date'||id==='e-allday'||id==='rp'||id==='rp-mode'||id==='rp-count'||id==='rp-until')refreshEv();
  if(id==='e-st'&&F.e)F.e.timeFixed=true;
  if(e.target.name==='carry'){g('cx-newbox').hidden=e.target.value!=='new';g('cx-feebox').hidden=e.target.value!=='none'}
  if(e.target.name==='price')g('s-cbox').hidden=e.target.value!=='custom';
  if(id==='st-remind'){S.settings.remind=e.target.value;run(()=>save(),e.target.value==='off'?L('通知を止めました','Notifications turned off'):L(`通知の時刻を ${e.target.value} にしました`,`Notification time set to ${e.target.value}`),e.target.value==='off'?'':L('前の日のこの時刻に、翌日の予定が届きます','Tomorrow’s schedule arrives at this time the night before'))}
});
document.addEventListener('keydown',e=>{
  if(e.target.id==='f-waza-add'&&e.key==='Enter'&&!e.isComposing){
    e.preventDefault();const w=e.target.value.trim();if(!w)return;
    if(!F.waza.includes(w))F.waza.push(w);e.target.value='';
    let chip=[...document.querySelectorAll('[data-act="fWaza"]')].find(x=>x.dataset.v===w);
    if(!chip){const box=document.createElement('div');box.className='chips';box.style.marginTop='6px';chip=document.createElement('button');chip.className='chip';chip.dataset.act='fWaza';chip.dataset.v=w;chip.textContent=w;box.appendChild(chip);e.target.before(box)}
    chip.setAttribute('aria-pressed','true');
  }
  if(e.target.id==='todo-new'&&e.key==='Enter'&&!e.isComposing){e.preventDefault();document.querySelector('[data-act="todoAdd"]').click()}
  if((e.target.id==='lg-pw'||e.target.id==='lg-id')&&e.key==='Enter'&&!e.isComposing){e.preventDefault();document.querySelector('[data-act="login"]')?.click()}
  if(e.key==='Escape')closeSheet();
});
let rz;addEventListener('resize',()=>{clearTimeout(rz);rz=setTimeout(()=>{if(UI.tab==='cal'&&!g('layer').innerHTML)render()},200)});
if('serviceWorker' in navigator)navigator.serviceWorker.register('sw.js').catch(()=>{});
start();
</script>
</body>
